<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de Ordenamiento Territorial — Distrito de Santiago</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#f4f4f4; color:#1a1a2e; }
  #header {
    position:fixed; top:0; left:0; right:0; z-index:1100;
    background:#1a3a5c; display:flex; align-items:center; gap:16px;
    padding:0 20px; height:56px; border-bottom:3px solid #c8961a;
  }
  #header .escudo {
    width:36px; height:36px; background:#c8961a; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:#fff; font-weight:700; flex-shrink:0;
  }
  #header h1 { font-size:14px; font-weight:600; color:#fff; line-height:1.3; }
  #header h1 span { display:block; font-size:11px; font-weight:400; color:#a8c4e0; margin-top:1px; }
  #header .badge {
    margin-left:auto; background:#c8961a; color:#1a3a5c;
    font-size:10px; font-weight:700; padding:3px 10px;
    border-radius:12px; letter-spacing:0.5px; text-transform:uppercase;
  }
  #container { display:flex; height:100vh; padding-top:56px; }
  #map { flex:1; z-index:1; }
  #panel {
    width:300px; flex-shrink:0; background:#fff;
    border-right:1px solid #dce3ed; display:flex; flex-direction:column;
    overflow:hidden; z-index:900;
  }
  #panel-tabs { display:flex; flex-shrink:0; border-bottom:2px solid #c8961a; }
  .tab-btn {
    flex:1; padding:10px 6px; font-size:11px; font-weight:600;
    color:#7a8aaa; background:#f7f9fc; border:none; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.4px; transition:all 0.15s;
    border-right:1px solid #eef0f4;
  }
  .tab-btn:last-child { border-right:none; }
  .tab-btn.active { background:#1a3a5c; color:#fff; }
  .tab-btn:hover:not(.active) { background:#edf2f8; color:#1a3a5c; }
  .tab-panel { display:none; flex:1; overflow-y:auto; flex-direction:column; }
  .tab-panel.active { display:flex; }

  /* SECCIÓN DE FILTROS */
  .filter-section { border-bottom:1px solid #eef0f4; }
  .filter-section-header {
    display:flex; align-items:center; gap:8px; padding:9px 14px;
    cursor:pointer; background:#f7f9fc; font-size:12px; font-weight:600;
    color:#1a3a5c; text-transform:uppercase; letter-spacing:0.4px;
    user-select:none; transition:background 0.15s;
  }
  .filter-section-header:hover { background:#edf2f8; }
  .fs-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .fs-arrow { margin-left:auto; font-size:10px; color:#7a8aaa; transition:transform 0.2s; }
  .fs-arrow.open { transform:rotate(90deg); }
  .filter-section-body { display:none; }
  .filter-section-body.open { display:block; }

  /* TOGGLE ALL */
  .toggle-all-row {
    display:flex; align-items:center; gap:6px;
    padding:5px 14px 3px 28px; font-size:11px; color:#1a3a5c;
    font-weight:600; border-bottom:1px solid #f0f0f0;
  }
  .toggle-all-row input { accent-color:#1a3a5c; cursor:pointer; }

  /* FILTRO CORREGIMIENTOS */
  .corr-item {
    display:flex; align-items:center; gap:8px;
    padding:4px 14px 4px 28px; font-size:12px; color:#2c3e50; cursor:pointer;
  }
  .corr-item:hover { background:#f0f5fb; }
  .corr-item input { accent-color:#1a3a5c; width:13px; height:13px; cursor:pointer; flex-shrink:0; }
  .corr-swatch { width:14px; height:10px; border-radius:2px; flex-shrink:0; border:1px solid rgba(0,0,0,0.15); }

  /* FILTRO ZONIFICACIÓN */
  .zona-cat { border-top:1px solid #f0f0f0; }
  .zona-cat-header {
    display:flex; align-items:center; gap:6px;
    padding:5px 14px 5px 28px; cursor:pointer;
    font-size:11px; font-weight:700; color:#fff;
    user-select:none;
  }
  .zona-cat-header input { accent-color:#fff; cursor:pointer; flex-shrink:0; }
  .zona-cat-arrow { margin-left:auto; font-size:9px; opacity:0.8; transition:transform 0.2s; }
  .zona-cat-arrow.open { transform:rotate(90deg); }
  .zona-codes { display:none; padding:2px 0; }
  .zona-codes.open { display:block; }
  .zona-code-item {
    display:flex; align-items:center; gap:7px;
    padding:3px 14px 3px 42px; font-size:11px; color:#2c3e50; cursor:pointer;
  }
  .zona-code-item:hover { background:#f0f5fb; }
  .zona-code-item input { accent-color:#1a3a5c; width:12px; height:12px; cursor:pointer; flex-shrink:0; }
  .zona-code-swatch { width:14px; height:9px; border-radius:2px; flex-shrink:0; border:1px solid rgba(0,0,0,0.15); }
  .zona-code-label { flex:1; }
  .zona-code-bold { font-weight:700; color:#1a3a5c; margin-right:3px; }

  /* ELEMENTO */
  #tab-info-content { padding:12px 14px; flex:1; }
  .info-title { font-size:10px; font-weight:600; color:#7a8aaa; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  #feature-info { font-size:12px; color:#2c3e50; line-height:1.6; }
  #feature-info.empty { color:#aaa; font-style:italic; }

  /* MAPA */
  .map-ctrl-btn {
    background:#fff; border:1px solid #ccc; border-radius:4px;
    padding:6px 10px; font-size:12px; cursor:pointer;
    color:#1a3a5c; font-weight:600; transition:background 0.15s;
  }
  .map-ctrl-btn:hover { background:#edf2f8; }
  .map-ctrl-btn.active { background:#1a3a5c; color:#fff; border-color:#1a3a5c; }
  #basemap-ctrl {
    position:absolute; top:76px; right:16px; z-index:999;
    display:flex; gap:4px; background:#fff;
    border:1px solid #ccc; border-radius:6px; padding:4px;
    box-shadow:0 1px 4px rgba(0,0,0,0.1);
  }
  #coords {
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    z-index:999; background:rgba(26,58,92,0.85); color:#fff;
    font-size:11px; padding:3px 10px; border-radius:12px; pointer-events:none;
  }
  #toggle-panel {
    position:absolute; top:76px; left:310px; z-index:998;
    background:#1a3a5c; color:#fff; border:none;
    width:22px; height:40px; cursor:pointer; border-radius:0 4px 4px 0;
    font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  #toggle-panel:hover { background:#0f2540; }

  /* STATS BAR */
  #stats-bar {
    flex-shrink:0; background:#1a3a5c; color:#a8c4e0;
    font-size:10px; padding:5px 14px; border-top:1px solid #0f2540;
    display:flex; gap:12px;
  }
  #stats-bar span { color:#fff; font-weight:600; }
</style>
</head>
<body>

<div id="header">
  <div class="escudo">S</div>
  <h1>Plan de Ordenamiento Territorial<span>Municipio de Santiago de Veraguas &nbsp;·&nbsp; Uso Interno</span></h1>
  <div class="badge">POT 2026</div>
</div>

<div id="container">
  <div id="panel">
    <div id="panel-tabs">
      <button class="tab-btn active" onclick="switchTab('filtros',this)">Filtros</button>
      <button class="tab-btn" onclick="switchTab('info',this)">Elemento</button>
    </div>

    <div id="tab-filtros" class="tab-panel active">
      <!-- SECCIÓN CORREGIMIENTOS -->
      <div class="filter-section">
        <div class="filter-section-header" onclick="toggleSection(this)">
          <span class="fs-dot" style="background:#4a235a"></span>
          <span>Corregimientos</span>
          <span class="fs-arrow open">&#9658;</span>
        </div>
        <div class="filter-section-body open">
          <div class="toggle-all-row">
            <input type="checkbox" id="corr-all" checked onchange="toggleAllCorr(this.checked)">
            <label for="corr-all">Todos / Ninguno</label>
          </div>
          <div id="corr-list"></div>
        </div>
      </div>

      <!-- SECCIÓN ZONIFICACIÓN -->
      <div class="filter-section">
        <div class="filter-section-header" onclick="toggleSection(this)">
          <span class="fs-dot" style="background:#c8961a"></span>
          <span>Zonificación Urbana</span>
          <span class="fs-arrow open">&#9658;</span>
        </div>
        <div class="filter-section-body open">
          <div class="toggle-all-row">
            <input type="checkbox" id="zona-all" checked onchange="toggleAllZona(this.checked)">
            <label for="zona-all">Todos / Ninguno</label>
          </div>
          <div id="zona-list"></div>
        </div>
      </div>
    </div>

    <div id="tab-info" class="tab-panel">
      <div id="tab-info-content">
        <div class="info-title">Información de elemento</div>
        <div id="feature-info" class="empty">Haz clic en un elemento del mapa</div>
      </div>
    </div>

    <div id="stats-bar">
      Corregimientos: <span id="stat-corr">0</span> &nbsp;|&nbsp; Zonas visibles: <span id="stat-zona">0</span>
    </div>
  </div>

  <button id="toggle-panel">&#8249;</button>

  <div id="map">
    <div id="basemap-ctrl">
      <button class="map-ctrl-btn active" onclick="setBasemap('osm',this)">Calles</button>
      <button class="map-ctrl-btn" onclick="setBasemap('satellite',this)">Satélite</button>
      <button class="map-ctrl-btn" onclick="setBasemap('blank',this)">Blanco</button>
    </div>
    <div id="coords">Lat: — &nbsp; Lng: —</div>
  </div>
</div>

<script>
// ============================================================
// UTILS
// ============================================================
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}
function toggleSection(hdr) {
  const body = hdr.nextElementSibling;
  body.classList.toggle('open');
  hdr.querySelector('.fs-arrow').classList.toggle('open');
}

// ============================================================
// MAPA
// ============================================================
const map = L.map('map',{center:[8.1,-80.98],zoom:11});
const BASEMAPS = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}),
  blank: L.tileLayer('',{attribution:''})
};
BASEMAPS.osm.addTo(map);
let currentBasemap='osm';
function setBasemap(name,btn) {
  BASEMAPS[currentBasemap].remove(); BASEMAPS[name].addTo(map); BASEMAPS[name].bringToBack();
  currentBasemap=name;
  document.querySelectorAll('.map-ctrl-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
}
map.on('mousemove',e=>{
  document.getElementById('coords').textContent='Lat: '+e.latlng.lat.toFixed(5)+'  Lng: '+e.latlng.lng.toFixed(5);
});

// ============================================================
// DATOS DE ZONAS Y CORREGIMIENTOS
// ============================================================
const CORR_COLORS = {
  'URRACA':'hsl(0,65%,50%)', 'SANTIAGO':'hsl(210,65%,45%)',
  'LA MESA':'hsl(140,55%,40%)', 'SAN MARTIN DE PORRES':'hsl(280,50%,45%)',
  'LA COLORADA':'hsl(30,80%,48%)', 'CANTO DEL LLANO':'hsl(170,55%,38%)',
  'CARLOS SANTANA AVILA':'hsl(20,70%,45%)', 'LA PEÑA':'hsl(160,55%,35%)',
  'LOS ALGARROBOS':'hsl(265,45%,48%)', 'PONUGA':'hsl(350,60%,42%)',
  'SAN PEDRO DEL ESPINO':'hsl(100,50%,38%)', 'RUFINA ALFARO':'hsl(25,70%,42%)',
  'RODRIGUEZ DE MENDOZA':'hsl(200,60%,40%)',
};
function getCorrColor(name) {
  if(!name) return '#aaa';
  const u=name.toUpperCase().trim();
  for(const k of Object.keys(CORR_COLORS)){if(u.includes(k))return CORR_COLORS[k];}
  let h=0; for(let i=0;i<u.length;i++) h=u.charCodeAt(i)+((h<<5)-h);
  return 'hsl('+(Math.abs(h)%360)+',55%,42%)';
}

const ZONA_CATS = [
  {cat:'Residencial', color:'#7d6608', zones:[
    {code:'R1',color:'#f9e79f',name:'Residencial Baja Densidad'},
    {code:'R2',color:'#f0b27a',name:'Residencial Media Densidad'},
    {code:'RM1',color:'#e59866',name:'Residencial Mixto'},
    {code:'MRCH',color:'#d4ac0d',name:'Mixto Residencial Comercial'},
  ]},
  {cat:'Comercial', color:'#922b21', zones:[
    {code:'C1',color:'#f1948a',name:'Comercial Local'},
    {code:'C2',color:'#e74c3c',name:'Comercial General'},
  ]},
  {cat:'Mixto Comercial Urbano', color:'#7b241c', zones:[
    {code:'MCU1',color:'#c0392b',name:'Mixto Comercial Urbano 1'},
    {code:'MCU2',color:'#a93226',name:'Mixto Comercial Urbano 2'},
    {code:'MCU3',color:'#922b21',name:'Mixto Comercial Urbano 3'},
    {code:'MCH',color:'#cb4335',name:'Mixto Comercial e Industrial'},
  ]},
  {cat:'Industrial', color:'#6c3483', zones:[
    {code:'IL',color:'#a569bd',name:'Industrial Liviano'},
    {code:'IM',color:'#7d3c98',name:'Industrial Mediano'},
  ]},
  {cat:'Parques y Protección', color:'#1e6832', zones:[
    {code:'Pv',color:'#58d68d',name:'Parque Verde'},
    {code:'PL',color:'#27ae60',name:'Parque Local'},
    {code:'Prv',color:'#1e8449',name:'Protección y Reserva'},
    {code:'Pru',color:'#196f3d',name:'Protección Rural'},
    {code:'Pib',color:'#117a65',name:'Protección de Riberas'},
    {code:'SINAP',color:'#82e0aa',name:'Áreas Protegidas (SINAP)'},
  ]},
  {cat:'Suelo Urbano Especial', color:'#1a5276', zones:[
    {code:'SIU',color:'#48c9b0',name:'Suelo de Interés Urbano'},
    {code:'RBS',color:'#76d7c4',name:'Reserva de Bajo Suelo'},
    {code:'CONSH',color:'#85c1e9',name:'Consolidación'},
    {code:'INF',color:'#5dade2',name:'Infraestructura'},
    {code:'PND',color:'#2e86c1',name:'Pendiente de Desarrollo'},
  ]},
  {cat:'Rural y Reserva', color:'#555', zones:[
    {code:'RR',color:'#a9cce3',name:'Reserva Rural'},
  ]},
  {cat:'Turismo y Transporte', color:'#784212', zones:[
    {code:'TA',color:'#f8c471',name:'Turismo y Alojamiento'},
    {code:'TTU',color:'#f0e68c',name:'Terminal Transporte Urbano'},
    {code:'TRS',color:'#fad7a0',name:'Transporte'},
  ]},
  {cat:'Cuerpos de Agua', color:'#1a6ea8', zones:[
    {code:'LAGO',color:'#7fb3d3',name:'Lago / Cuerpo de Agua'},
  ]},
];
const ZONA_MAP = {};
ZONA_CATS.forEach(cat=>cat.zones.forEach(z=>{ZONA_MAP[z.code]=z;}));

// ============================================================
// ESTADO DE FILTROS
// ============================================================
const activeCorr = new Set(Object.keys(CORR_COLORS)); // todos activos al inicio
const activeZona = new Set(Object.keys(ZONA_MAP));    // todos activos al inicio

// ============================================================
// CAPAS LEAFLET
// ============================================================
let corrLayer = null;
let zonaLayer = null;
let corrData = null;
let zonaData = null;

function applyFilters() {
  // Reconstruir capa corregimientos
  if(corrData) {
    if(corrLayer) map.removeLayer(corrLayer);
    corrLayer = L.geoJSON(corrData, {
      style: f => {
        const name = (f.properties.CORR_NOMB||'').toUpperCase().trim();
        // verificar si alguna clave activa está en el nombre
        const isActive = [...activeCorr].some(k => name.includes(k));
        if(!isActive) return {fillOpacity:0, opacity:0, weight:0};
        return {color:'#fff',weight:1.5,opacity:0.9,fillColor:getCorrColor(f.properties.CORR_NOMB),fillOpacity:0.6};
      },
      onEachFeature: (f,l) => {
        const name = (f.properties.CORR_NOMB||'').toUpperCase().trim();
        const isActive = [...activeCorr].some(k=>name.includes(k));
        if(!isActive) return;
        l.on('click', e => showPopup(f, l, e.latlng, 'Corregimientos'));
      }
    }).addTo(map);
  }

  // Reconstruir capa zonificación
  if(zonaData) {
    if(zonaLayer) map.removeLayer(zonaLayer);
    // Determinar qué corregimientos están activos para filtro espacial
    // (simplificado: si NO hay filtro de corregimiento activo mostramos todo)
    const allCorrActive = activeCorr.size === Object.keys(CORR_COLORS).length;

    zonaLayer = L.geoJSON(zonaData, {
      style: f => {
        const ref = f.properties.RefName;
        if(!activeZona.has(ref)) return {fillOpacity:0,opacity:0,weight:0};
        const z = ZONA_MAP[ref];
        return {color:'#555',weight:0.5,opacity:0.7,fillColor:z?z.color:'#ccc',fillOpacity:0.75};
      },
      filter: f => {
        // Filtro espacial por corregimiento usando CORR_ID si existe, o simplificamos con punto-en-polígono
        if(activeCorr.size === 0) return false;
        const ref = f.properties.RefName;
        if(!activeZona.has(ref)) return false;
        // Si todos los corregimientos están activos, mostrar todo
        if(allCorrActive) return true;
        // Si hay filtro de corregimiento, filtrar por intersección geométrica
        // Usamos el centroide del feature para verificar qué corregimiento lo contiene
        if(!corrData) return true;
        return featureInActiveCorr(f);
      },
      onEachFeature: (f,l) => {
        l.on('click', e => showPopup(f, l, e.latlng, 'Zonificación Urbana'));
      }
    }).addTo(map);
    // Asegurar que corregimientos estén arriba
    if(corrLayer) corrLayer.bringToFront();
  }

  updateStats();
}

// Verificar si el centroide de una feature de zona cae dentro de algún corregimiento activo
function featureInActiveCorr(zonaFeature) {
  if(!corrData) return true;
  // Calcular centroide aproximado
  let cx=0, cy=0, count=0;
  const coords = zonaFeature.geometry.coordinates;
  function processRing(ring) {
    ring.forEach(pt=>{ cx+=pt[0]; cy+=pt[1]; count++; });
  }
  if(zonaFeature.geometry.type==='Polygon') { processRing(coords[0]); }
  else if(zonaFeature.geometry.type==='MultiPolygon') { coords.forEach(poly=>processRing(poly[0])); }
  if(count===0) return false;
  cx/=count; cy/=count;
  const pt = [cx,cy];

  // Verificar si el punto cae en algún corregimiento activo
  for(const corrFeature of corrData.features) {
    const name = (corrFeature.properties.CORR_NOMB||'').toUpperCase().trim();
    const isActive = [...activeCorr].some(k=>name.includes(k));
    if(!isActive) continue;
    if(pointInFeature(pt, corrFeature)) return true;
  }
  return false;
}

// Point-in-polygon simplificado
function pointInFeature(pt, feature) {
  const geom = feature.geometry;
  if(geom.type==='Polygon') return pointInPolygon(pt, geom.coordinates[0]);
  if(geom.type==='MultiPolygon') return geom.coordinates.some(poly=>pointInPolygon(pt,poly[0]));
  return false;
}
function pointInPolygon(pt, ring) {
  let inside=false;
  const x=pt[0], y=pt[1];
  for(let i=0,j=ring.length-1; i<ring.length; j=i++) {
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

function updateStats() {
  document.getElementById('stat-corr').textContent = activeCorr.size;
  document.getElementById('stat-zona').textContent = activeZona.size;
}

function showPopup(f, l, latlng, layerName) {
  const props = f.properties||{};
  const corrNomb = props.CORR_NOMB;
  const ref = props.RefName;
  let badge='';
  if(corrNomb) {
    badge='<div style="margin:4px 0;"><span style="background:'+getCorrColor(corrNomb)+';color:#fff;font-size:12px;font-weight:600;padding:3px 12px;border-radius:12px;">'+corrNomb+'</span></div>';
  }
  if(ref && ZONA_MAP[ref]) {
    const z=ZONA_MAP[ref];
    badge='<div style="margin:4px 0;"><span style="background:'+z.color+';color:#333;font-size:12px;font-weight:600;padding:3px 12px;border-radius:12px;border:1px solid rgba(0,0,0,0.15);">'+ref+' — '+z.name+'</span></div>';
  }
  const keys=Object.keys(props).filter(k=>props[k]!==null&&props[k]!=='');
  let html='<strong style="color:#1a3a5c;font-size:13px;">'+layerName+'</strong>'+badge+'<hr style="margin:5px 0">';
  keys.slice(0,10).forEach(k=>{
    html+='<span style="font-size:11px;color:#777;">'+k+':</span> <b style="font-size:12px;color:#1a1a2e;">'+props[k]+'</b><br>';
  });
  document.getElementById('feature-info').classList.remove('empty');
  document.getElementById('feature-info').innerHTML=html;
  L.popup({maxWidth:320}).setLatLng(latlng).setContent(html).openOn(map);
}

// ============================================================
// CARGAR DATOS
// ============================================================
async function loadAll() {
  const [corrResp, zonaResp] = await Promise.all([
    fetch('data/DISTRITO.geojson'),
    fetch('data/ZONIFICACION.geojson')
  ]);
  corrData = await corrResp.json();
  zonaData = await zonaResp.json();

  // Descubrir corregimientos reales en el GeoJSON
  const corrNames = new Set();
  corrData.features.forEach(f=>{
    const n=(f.properties.CORR_NOMB||'').trim();
    if(n) corrNames.add(n);
  });

  buildCorrFilter([...corrNames].sort());
  buildZonaFilter();
  applyFilters();
}

// ============================================================
// CONSTRUIR FILTRO CORREGIMIENTOS
// ============================================================
function buildCorrFilter(names) {
  // Reiniciar activeCorr con nombres reales
  activeCorr.clear();
  names.forEach(n=>activeCorr.add(n.toUpperCase().trim()));

  const container = document.getElementById('corr-list');
  names.forEach(name => {
    const key = name.toUpperCase().trim();
    const color = getCorrColor(name);
    const div = document.createElement('div');
    div.className = 'corr-item';
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked=true; cb.id='corr-'+key;
    cb.addEventListener('change', ()=>{
      if(cb.checked) activeCorr.add(key); else activeCorr.delete(key);
      updateAllCorrCheckbox();
      applyFilters();
    });
    const swatch=document.createElement('span');
    swatch.className='corr-swatch'; swatch.style.background=color;
    const label=document.createElement('label');
    label.htmlFor='corr-'+key; label.textContent=name;
    label.style.cursor='pointer'; label.style.fontSize='11px';
    div.appendChild(cb); div.appendChild(swatch); div.appendChild(label);
    container.appendChild(div);
  });
}

function toggleAllCorr(checked) {
  activeCorr.clear();
  document.querySelectorAll('#corr-list input').forEach(cb=>{
    cb.checked=checked;
    if(checked) activeCorr.add(cb.id.replace('corr-',''));
  });
  applyFilters();
}
function updateAllCorrCheckbox() {
  const all=document.querySelectorAll('#corr-list input');
  const checked=[...all].filter(c=>c.checked).length;
  const allCb=document.getElementById('corr-all');
  allCb.checked=checked===all.length;
  allCb.indeterminate=checked>0&&checked<all.length;
}

// ============================================================
// CONSTRUIR FILTRO ZONIFICACIÓN
// ============================================================
function buildZonaFilter() {
  const container=document.getElementById('zona-list');
  ZONA_CATS.forEach(cat=>{
    const catDiv=document.createElement('div');
    catDiv.className='zona-cat';

    // Header de categoría con checkbox + toggle
    const hdr=document.createElement('div');
    hdr.className='zona-cat-header';
    hdr.style.background=cat.color;
    const catCb=document.createElement('input');
    catCb.type='checkbox'; catCb.checked=true;
    const catLabel=document.createElement('span');
    catLabel.textContent=cat.cat; catLabel.style.flex='1';
    const arrow=document.createElement('span');
    arrow.className='zona-cat-arrow'; arrow.innerHTML='&#9658;';
    hdr.appendChild(catCb); hdr.appendChild(catLabel); hdr.appendChild(arrow);
    catDiv.appendChild(hdr);

    // Códigos individuales
    const codesDiv=document.createElement('div');
    codesDiv.className='zona-codes';

    cat.zones.forEach(z=>{
      const row=document.createElement('div');
      row.className='zona-code-item';
      const cb=document.createElement('input');
      cb.type='checkbox'; cb.checked=true; cb.id='zona-'+z.code;
      cb.addEventListener('change',()=>{
        if(cb.checked) activeZona.add(z.code); else activeZona.delete(z.code);
        updateCatCheckbox(catCb, cat);
        updateAllZonaCheckbox();
        applyFilters();
      });
      const swatch=document.createElement('span');
      swatch.className='zona-code-swatch'; swatch.style.background=z.color;
      const lbl=document.createElement('label');
      lbl.htmlFor='zona-'+z.code; lbl.className='zona-code-label';
      lbl.innerHTML='<span class="zona-code-bold">'+z.code+'</span>'+z.name;
      lbl.style.cursor='pointer';
      row.appendChild(cb); row.appendChild(swatch); row.appendChild(lbl);
      codesDiv.appendChild(row);
    });
    catDiv.appendChild(codesDiv);

    // Toggle expand/collapse
    hdr.addEventListener('click', e=>{
      if(e.target===catCb) return;
      codesDiv.classList.toggle('open');
      arrow.classList.toggle('open');
    });

    // Cat checkbox → toggle todos sus hijos
    catCb.addEventListener('change',()=>{
      cat.zones.forEach(z=>{
        const cb=document.getElementById('zona-'+z.code);
        cb.checked=catCb.checked;
        if(catCb.checked) activeZona.add(z.code); else activeZona.delete(z.code);
      });
      updateAllZonaCheckbox();
      applyFilters();
    });

    container.appendChild(catDiv);
  });
}

function updateCatCheckbox(catCb, cat) {
  const cbs=cat.zones.map(z=>document.getElementById('zona-'+z.code));
  const checked=cbs.filter(c=>c.checked).length;
  catCb.checked=checked===cbs.length;
  catCb.indeterminate=checked>0&&checked<cbs.length;
}
function toggleAllZona(checked) {
  ZONA_CATS.forEach(cat=>{
    cat.zones.forEach(z=>{
      const cb=document.getElementById('zona-'+z.code);
      if(cb){cb.checked=checked; if(checked)activeZona.add(z.code); else activeZona.delete(z.code);}
    });
    // Actualizar cat checkboxes
    const catItems=document.querySelectorAll('.zona-cat-header input');
    catItems.forEach(c=>{c.checked=checked; c.indeterminate=false;});
  });
  applyFilters();
}
function updateAllZonaCheckbox() {
  const all=document.querySelectorAll('#zona-list .zona-code-item input');
  const checked=[...all].filter(c=>c.checked).length;
  const allCb=document.getElementById('zona-all');
  allCb.checked=checked===all.length;
  allCb.indeterminate=checked>0&&checked<all.length;
}

// ============================================================
// TOGGLE PANEL
// ============================================================
const panelEl=document.getElementById('panel');
const toggleBtn=document.getElementById('toggle-panel');
let panelOpen=true;
toggleBtn.addEventListener('click',()=>{
  panelOpen=!panelOpen;
  panelEl.style.display=panelOpen?'':'none';
  toggleBtn.textContent=panelOpen?'\u2039':'\u203a';
  toggleBtn.style.left=panelOpen?'310px':'0';
  map.invalidateSize();
});

// ============================================================
// INICIAR
// ============================================================
loadAll().catch(e=>console.error('Error cargando datos:',e));
</script>
